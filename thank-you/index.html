<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#092341">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="HRoboのサービス紹介資料をダウンロードいただけます。">
  <title>資料のお受け取り｜HRobo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--navy:#092341;--ink:#102a47;--mint:#54dfc2;--line:#dce7e8}
    *,*::before,*::after{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f0fbf8 0%,#fbffff 52%,#e8f3f6 100%);color:var(--ink);font-family:"Noto Sans JP","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}
    a:focus-visible{outline:3px solid #17b99e;outline-offset:5px}
    .header{background:#fff;border-bottom:1px solid #e1eaea}
    .header-inner{width:min(1050px,calc(100% - 44px));margin:auto;min-height:79px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .header img{display:block;width:153px;height:auto}
    .header-note{color:#687f8c;font-size:11px;letter-spacing:.11em;font-weight:700}
    main{width:min(1000px,calc(100% - 38px));margin:0 auto;padding:66px 0 72px}
    .card{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);background:white;border:1px solid #e3eeef;border-radius:16px;box-shadow:0 30px 75px #123e4b19}
    .content{padding:67px 60px 65px;position:relative;z-index:1}
    .check{width:51px;height:51px;display:grid;place-items:center;background:#e2faf2;border:1px solid #c1ecde;border-radius:50%;font-size:28px;color:#078871;font-weight:800;margin-bottom:23px}
    .eyebrow{margin:0 0 13px;color:#148b79;font-size:12px;letter-spacing:.18em;font-weight:800}
    h1{font-family:"Noto Serif JP","Yu Mincho",serif;font-weight:600;font-size:clamp(28px,3.3vw,40px);letter-spacing:-.045em;line-height:1.55;margin:0 0 21px}
    .lead{font-size:14px;line-height:2;color:#496274;margin:0 0 30px;max-width:500px}
    .download{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:62px;padding:17px 28px;text-decoration:none;color:#07343c;background:#61e2c6;border-radius:6px;font-weight:800;font-size:15px;box-shadow:0 13px 30px #1ba98a25;transition:transform .2s,background .2s}
    .download:hover{background:#81f0d9;transform:translateY(-2px)}
    .download svg{width:19px;height:19px;flex:none}
    .hint{font-size:11px;line-height:1.9;color:#7b8d9a;margin:19px 0 0}
    .preview{min-height:480px;background:linear-gradient(142deg,#0a2a4d 0%,#0e3b56 75%,#1f6d77 100%);display:flex;justify-content:center;align-items:center;position:relative;padding:45px 32px}
    .preview::before{content:"";position:absolute;width:450px;height:450px;top:-260px;right:-150px;background:linear-gradient(150deg,#8af6d9,#1f7e90);border-radius:100px;transform:rotate(38deg);opacity:.9}
    .preview::after{content:"";position:absolute;width:250px;height:250px;bottom:-190px;left:-140px;background:#82f6dc;border-radius:100px;transform:rotate(42deg);opacity:.19}
    .paper{position:relative;z-index:1;width:min(290px,100%);background:white;padding:10px 10px 14px;box-shadow:0 25px 45px #0006;transform:rotate(2deg);border-radius:3px}
    .paper img{display:block;width:100%;height:auto;aspect-ratio:1054/1491;object-fit:cover}
    .paper-caption{display:block;text-align:center;font-weight:700;letter-spacing:.08em;color:#75818d;font-size:11px;margin-top:12px}
    .footer{display:flex;justify-content:space-between;align-items:center;gap:22px;margin-top:25px;font-size:11px;color:#718592;line-height:1.8}
    .footer a{text-decoration:underline;text-underline-offset:3px}
    @media(max-width:760px){main{padding:30px 0 55px}.card{grid-template-columns:1fr}.content{padding:43px 30px 38px}.preview{min-height:0;padding:31px}.paper{width:185px}.footer{flex-direction:column;align-items:flex-start;gap:8px}}
    @media(max-width:430px){.header-inner{min-height:66px}.header img{width:127px}.header-note{font-size:9px}.content{padding:33px 24px 34px}.eyebrow{font-size:11px}.lead{font-size:13px}.download{width:100%;font-size:14px;padding-inline:13px}.hint{font-size:10px}}
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="../" aria-label="HRoboのトップページに戻る"><img src="../assets/HRobo_LOGO.png" width="153" height="46" alt="HRobo"></a>
      <span class="header-note">SERVICE GUIDE</span>
    </div>
  </header>
  <main>
    <section class="card" aria-labelledby="page-title">
      <div class="content">
        <div class="check" aria-hidden="true">✓</div>
        <p class="eyebrow">THANK YOU</p>
        <h1 id="page-title">資料のご請求、<br>ありがとうございます。</h1>
        <p class="lead">HRoboのサービス紹介資料をご用意しました。以下のボタンから、サービスの特徴や活用イメージをまとめた資料をご覧いただけます。</p>
        <a class="download" href="../assets/HRobo_Service_Guide.pdf" target="_blank" rel="noopener noreferrer" aria-label="HRoboのサービス紹介資料PDF（7ページ）を開く">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg>
          HRoboの資料をダウンロード
        </a>
        <p class="hint">PDF形式・全7ページ。ボタンを押すと資料が開きます。<br>スマートフォンでは、閲覧画面から保存することもできます。</p>
      </div>
      <div class="preview" aria-label="HRoboサービス紹介資料の表紙イメージ">
        <div class="paper">
          <img src="../assets/ミントで魅せるHRoboの新章.png" width="1054" height="1491" alt="HRobo 仕事のやりとりを、組織の力に。" loading="lazy">
          <span class="paper-caption">HRobo SERVICE GUIDE</span>
        </div>
      </div>
    </section>
    <footer class="footer">
      <span>© HRobo. 一部機能（メール・Teams連携など）は現在開発中です。</span>
      <span><a href="../">HRoboについて見る</a></span>
    </footer>
  </main>
</body>
</html>
